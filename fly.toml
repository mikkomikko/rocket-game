# fly.toml app configuration file generated for rocket-duel on 2026-11-21T15:24:43+02:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'rocket-duel'
primary_region = 'arn'

[build]
[env]
  MAX_ROOMS = '200'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 500
    soft_limit = 400

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
